# ============================================================
# Souss Garden — Application Properties
# Les credentials sont lus depuis les variables d'environnement
# ============================================================
spring.config.import=optional:file:.env[.properties]

# 1. Base de données Neon (PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# 2. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# 3. Port du serveur
server.port=8080

# 4. JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh.expiration.ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# 5. Admin credentials
admin.username=${ADMIN_USERNAME}
admin.password.hash=${ADMIN_PASSWORD_HASH}

# 6. CORS — Origines autorisées
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# 7. Mail (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 8. Cloudinary
cloudinary.url=${CLOUDINARY_URL:cloudinary://123456:abcdef@fakename}
