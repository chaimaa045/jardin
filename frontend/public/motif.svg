<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply" result="out"/>
    </filter>
    <radialGradient id="dew" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#80c8d0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#80c8d0" stop-opacity="0.15"/>
    </radialGradient>
    <radialGradient id="dew2" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#a0d8d8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a0d8d8" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="200" height="200" fill="#eaf4f4"/>
  <rect width="200" height="200" fill="#d0e8ec" opacity="0.22" filter="url(#paper)"/>

  <!-- Branche principale -->
  <path d="M 18 8 C 35 28, 55 48, 72 75 C 88 100, 105 128, 118 160 C 126 178, 134 192, 140 200"
        fill="none" stroke="#5a8090" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>

  <!-- Branche secondaire -->
  <path d="M 72 75 C 58 82, 44 92, 30 105 C 20 115, 10 128, 4 140"
        fill="none" stroke="#5a8090" stroke-width="0.9" stroke-linecap="round" opacity="0.4"/>

  <!-- Petite branchette -->
  <path d="M 105 128 C 115 120, 128 116, 142 118"
        fill="none" stroke="#5a8090" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>

  <!-- Grande feuille 1 -->
  <path d="M 72 75 C 52 48, 22 38, 8 22 C 22 38, 44 58, 72 75 Z"
        fill="#4a9090" opacity="0.28"/>
  <path d="M 72 75 C 52 48, 22 38, 8 22 C 22 38, 44 58, 72 75 Z"
        fill="none" stroke="#4a9090" stroke-width="0.8" opacity="0.55"/>
  <line x1="72" y1="75" x2="8" y2="22" stroke="#2a7080" stroke-width="0.5" opacity="0.45"/>
  <path d="M 40 48 Q 36 42, 28 38" fill="none" stroke="#2a7080" stroke-width="0.35" opacity="0.35"/>
  <path d="M 52 58 Q 50 50, 42 46" fill="none" stroke="#2a7080" stroke-width="0.35" opacity="0.35"/>
  <path d="M 30 36 Q 22 32, 16 28" fill="none" stroke="#2a7080" stroke-width="0.35" opacity="0.3"/>

  <!-- Grande feuille 2 -->
  <path d="M 55 48 C 72 30, 100 18, 118 8 C 100 18, 80 34, 55 48 Z"
        fill="#2a7080" opacity="0.22"/>
  <path d="M 55 48 C 72 30, 100 18, 118 8 C 100 18, 80 34, 55 48 Z"
        fill="none" stroke="#2a7080" stroke-width="0.8" opacity="0.5"/>
  <line x1="55" y1="48" x2="118" y2="8" stroke="#4a9090" stroke-width="0.5" opacity="0.4"/>
  <path d="M 86 28 Q 90 22, 96 18" fill="none" stroke="#4a9090" stroke-width="0.35" opacity="0.3"/>
  <path d="M 72 38 Q 76 30, 82 24" fill="none" stroke="#4a9090" stroke-width="0.35" opacity="0.3"/>

  <!-- Feuille lotus -->
  <path d="M 30 105 C 10 88, 2 68, 12 52 C 22 68, 28 88, 30 105 Z"
        fill="#3a8878" opacity="0.2"/>
  <path d="M 30 105 C 50 88, 58 68, 48 52 C 38 68, 32 88, 30 105 Z"
        fill="#3a8878" opacity="0.2"/>
  <path d="M 30 105 C 10 88, 2 68, 12 52 C 22 68, 28 88, 30 105 Z M 30 105 C 50 88, 58 68, 48 52 C 38 68, 32 88, 30 105 Z"
        fill="none" stroke="#3a8878" stroke-width="0.7" opacity="0.5"/>
  <path d="M 30 105 Q 30 115, 26 128" fill="none" stroke="#6aaab0" stroke-width="0.6" opacity="0.4"/>

  <!-- Feuille elliptique -->
  <ellipse cx="148" cy="114" rx="10" ry="5" transform="rotate(-25 148 114)"
           fill="#4a9090" opacity="0.22" stroke="#4a9090" stroke-width="0.7"/>
  <line x1="138" y1="118" x2="158" y2="110" stroke="#2a7080" stroke-width="0.4" opacity="0.38" transform="rotate(-25 148 114)"/>

  <!-- Herbes fines — bas gauche -->
  <path d="M 0 200 Q 5 182, 2 165" fill="none" stroke="#6aaab0" stroke-width="0.6" stroke-linecap="round" opacity="0.35"/>
  <path d="M 6 200 Q 14 178, 10 158" fill="none" stroke="#6aaab0" stroke-width="0.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 14 200 Q 18 185, 16 172" fill="none" stroke="#6aaab0" stroke-width="0.45" stroke-linecap="round" opacity="0.25"/>
  <path d="M 10 158 Q 4 152, 0 148" fill="none" stroke="#4a9090" stroke-width="0.4" opacity="0.3"/>
  <path d="M 10 158 Q 16 152, 18 148" fill="none" stroke="#4a9090" stroke-width="0.4" opacity="0.3"/>

  <!-- Herbes fines — haut droit -->
  <path d="M 200 0 Q 190 18, 194 35" fill="none" stroke="#6aaab0" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>
  <path d="M 192 0 Q 182 22, 186 40" fill="none" stroke="#6aaab0" stroke-width="0.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Nénuphar -->
  <circle cx="170" cy="168" r="16" fill="none" stroke="#3a8878" stroke-width="0.6" opacity="0.2"/>
  <circle cx="170" cy="168" r="11" fill="none" stroke="#3a8878" stroke-width="0.5" opacity="0.18"/>
  <circle cx="170" cy="168" r="6"  fill="none" stroke="#3a8878" stroke-width="0.5" opacity="0.2"/>
  <circle cx="170" cy="168" r="2"  fill="#3a8878" opacity="0.2"/>
  <path d="M 170 152 L 170 168" stroke="#3a8878" stroke-width="0.4" opacity="0.18"/>
  <path d="M 154 168 L 170 168" stroke="#3a8878" stroke-width="0.4" opacity="0.18"/>
  <path d="M 158 156 L 170 168" stroke="#3a8878" stroke-width="0.4" opacity="0.15"/>
  <path d="M 182 156 L 170 168" stroke="#3a8878" stroke-width="0.4" opacity="0.15"/>

  <!-- Gouttes de rosée -->
  <ellipse cx="28" cy="54" rx="3.2" ry="4" fill="url(#dew)" stroke="#80c8d0" stroke-width="0.4" opacity="0.85"/>
  <ellipse cx="26.8" cy="52.5" rx="0.8" ry="1" fill="#ffffff" opacity="0.7"/>

  <ellipse cx="88" cy="102" rx="2.4" ry="3" fill="url(#dew)" stroke="#80c8d0" stroke-width="0.35" opacity="0.8"/>
  <ellipse cx="87" cy="100.8" rx="0.6" ry="0.8" fill="#ffffff" opacity="0.7"/>

  <circle cx="60" cy="88" r="1.6" fill="url(#dew2)" stroke="#a0d8d8" stroke-width="0.3" opacity="0.75"/>
  <circle cx="118" cy="148" r="1.4" fill="url(#dew2)" stroke="#a0d8d8" stroke-width="0.3" opacity="0.7"/>
  <circle cx="152" cy="130" r="1.2" fill="url(#dew2)" stroke="#a0d8d8" stroke-width="0.3" opacity="0.65"/>
  <circle cx="42" cy="130" r="1.0" fill="url(#dew)" stroke="#80c8d0" stroke-width="0.25" opacity="0.65"/>
  <circle cx="175" cy="58" r="1.3" fill="url(#dew2)" stroke="#a0d8d8" stroke-width="0.3" opacity="0.6"/>

  <!-- Micro-points -->
  <circle cx="95" cy="48" r="0.7" fill="#80c8d0" opacity="0.5"/>
  <circle cx="140" cy="88" r="0.6" fill="#80c8d0" opacity="0.45"/>
  <circle cx="18" cy="88" r="0.7" fill="#a0d8d8" opacity="0.4"/>
  <circle cx="165" cy="38" r="0.6" fill="#80c8d0" opacity="0.4"/>

  <!-- Spirale organique — bas droit -->
  <path d="M 198 185 C 192 182, 188 176, 190 170 C 192 164, 198 162, 200 168 C 202 172, 198 176, 195 174 C 192 172, 193 168, 196 168"
        fill="none" stroke="#2090a0" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>

  <!-- Spirale organique — haut gauche -->
  <path d="M 2 15 C 8 18, 12 24, 10 30 C 8 36, 2 38, 0 32 C -2 28, 2 24, 5 26 C 8 28, 7 32, 4 32"
        fill="none" stroke="#2090a0" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
</svg>
